name: Import Dragon Egg GLB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-glb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download GLB from GitHub Release
        run: |
          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            -o assets/dragon-egg.glb \
            "https://github.com/AOL83/auroralogisticalecoholdings/releases/download/v0.1-assets/Meshy_AI_Neon_Scarab_Egg_0502151603_generate.1.glb"

      - name: Confirm GLB file
        run: |
          ls -lh assets/dragon-egg.glb
          file assets/dragon-egg.glb || true

      - name: Commit GLB into repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add assets/dragon-egg.glb

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import dragon egg GLB asset"
            git push
          fi
