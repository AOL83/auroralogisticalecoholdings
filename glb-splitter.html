<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ALEH GLB Splitter</title>
<style>
:root {
  --bg: #02040a;
  --panel: rgba(4, 10, 24, .78);
  --cyan: #00f5ff;
  --pink: #ff2bd6;
  --green: #7cff00;
  --yellow: #ffe600;
  --text: #e8fbff;
  --muted: #8fb7c8;
  --mono: "SF Mono", Menlo, Consolas, monospace;
  --ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 32px;
  background:
    radial-gradient(circle at 50% 30%, rgba(0,245,255,.13), transparent 28%),
    radial-gradient(circle at 20% 70%, rgba(255,43,214,.12), transparent 34%),
    var(--bg);
  color: var(--text);
  font-family: var(--ui);
}

main {
  width: min(960px, 100%);
  margin: 0 auto;
  border: 1px solid rgba(0,245,255,.28);
  border-radius: 28px;
  padding: 26px;
  background: var(--panel);
  box-shadow: 0 0 45px rgba(0,245,255,.15);
}

h1 {
  margin: 0 0 12px;
  font-family: Impact, Arial Black, sans-serif;
  font-size: clamp(2.4rem, 7vw, 5rem);
  line-height: 1;
  letter-spacing: .04em;
  background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan), var(--green));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

p {
  color: var(--muted);
  line-height: 1.6;
}

input,
button {
  width: 100%;
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(0,245,255,.34);
  background: rgba(0,0,0,.42);
  color: var(--text);
  font-family: var(--mono);
}

button {
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .12em;
}

button:hover {
  background: rgba(0,245,255,.12);
}

.log {
  margin-top: 18px;
  min-height: 160px;
  border: 1px solid rgba(0,245,255,.18);
  border-radius: 16px;
  padding: 14px;
  background: rgba(0,0,0,.34);
  font-family: var(--mono);
  font-size: .82rem;
  white-space: pre-wrap;
  color: #dffcff;
}
</style>
</head>
<body>
<main>
  <h1>GLB Splitter</h1>
  <p>
    Select the Meshy GLB. This tool splits it into browser-upload-safe chunks under 25 MB.
    It does not upload anything anywhere. It runs locally in your browser.
  </p>

  <input id="file" type="file" accept=".glb,.bin,model/gltf-binary" />
  <button id="split">Split GLB into GitHub-safe chunks</button>

  <div class="log" id="log">Waiting for GLB...</div>
</main>

<script>
const fileInput = document.getElementById("file");
const splitButton = document.getElementById("split");
const log = document.getElementById("log");

const CHUNK_SIZE = 20 * 1024 * 1024;

function write(message) {
  log.textContent += "\\n" + message;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

splitButton.addEventListener("click", async () => {
  const file = fileInput.files && fileInput.files[0];

  if (!file) {
    log.textContent = "No file selected.";
    return;
  }

  log.textContent = "Selected: " + file.name;
  write("Size: " + (file.size / 1024 / 1024).toFixed(2) + " MB");

  const partCount = Math.ceil(file.size / CHUNK_SIZE);
  write("Chunk size: 20 MB");
  write("Parts to generate: " + partCount);

  const manifest = {
    name: "Aurora Dragon Egg GLB",
    originalFilename: file.name,
    mimeType: "model/gltf-binary",
    totalBytes: file.size,
    chunkSize: CHUNK_SIZE,
    parts: []
  };

  for (let i = 0; i < partCount; i++) {
    const start = i * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, file.size);
    const partNumber = String(i + 1).padStart(3, "0");
    const filename = `dragon-egg.part${partNumber}.bin`;
    const blob = file.slice(start, end);

    manifest.parts.push({
      file: filename,
      bytes: blob.size
    });

    write("Downloading " + filename + " (" + (blob.size / 1024 / 1024).toFixed(2) + " MB)");
    downloadBlob(blob, filename);

    await new Promise(resolve => setTimeout(resolve, 300));
  }

  const manifestBlob = new Blob(
    [JSON.stringify(manifest, null, 2)],
    { type: "application/json" }
  );

  write("Downloading manifest.json");
  downloadBlob(manifestBlob, "manifest.json");

  write("");
  write("Done.");
  write("Upload all generated files to:");
  write("auroralogisticalecoholdings/assets/dragon-egg/");
});
</script>
</body>
</html>
